experience:
- name: 河北诺亚人力资源发展集团有限公司
  position: "首席AI架构师"
  date: 2025.5 - 2026.7
  description: >-
    <p><strong>公司背景：</strong>河北诺亚人力资源发展集团成立于2001年，是河北省领先的人力资源服务机构，业务覆盖人力资源RPO（业务流程外包）、KPO（高端才智外包）、人才引进与创业孵化服务，服务网络覆盖河北省11个地市，并在京津冀区域持续拓展数字化人力资源服务体系。</p>
    <p><strong>工作职责：</strong></p>
    <ol>
      <li>负责集团 AI技术战略与算力平台规划，建设企业级 GPU算力平台，推动大模型在集团业务中的私有化部署与规模化应用。</li>
      <li>主导Qwen、DeepSeek 等大模型私有化部署与微调（SFT），构建面向人力资源场景的智能应用体系。</li>
      <li>基于 MINEU + GraphRAG 构建集团级人力资源知识库问答系统（HR RAG），整合政策法规、招聘流程及业务知识，实现智能检索与问答服务。</li>
      <li>设计并落地 AI面试官系统，基于 DeepAgent 多智能体架构实现简历解析、智能提问、候选人能力评估等自动化面试流程。</li>
      <li>推动 AI与企业数据平台融合，对接集团数据仓库与数据治理体系（Doris、DolphinScheduler、ETL、FineReport BI、DataEase），构建数据驱动的智能分析与决策支持能力。</li>
      <li>负责AI项目的技术选型、架构设计与团队技术管理，推动AI能力在人力资源招聘、人才评估与企业服务场景中的实际落地。</li>
    </ol>
- name: 中移在线服务有限公司河北分公司
  position: "高级AI算法工程师"
  date: 2018.5 - 2025.5
  description: >-
    <p><strong>公司背景：</strong>中国移动在线服务有限公司河北分公司为河北移动客服中心，负责全省约 3000万移动用户的客户服务与运营支撑，涵盖 10086热线、移动APP、微信公众号等多渠道客服体系。核心业务系统包括 CRM、业务支撑系统、来电客户轨迹系统、精准营销系统、IVR智能导航及灵犀平台，服务场景涉及 CHBN（个人客户、家庭客户、政企客户及新兴业务）。</p>
    <p><strong>工作职责：</strong></p>
    <ol>
      <li>负责智能客服与语音语义理解系统研发，构建基于NLP与大模型的客户来电意图识别与IVR智能导航系统，提升热线自助服务分流能力。</li>
      <li>基于历史客服通话语料与投诉工单数据，开发工单NLP分析与投诉分类模型，实现自动标签化、问题归因及服务质量分析。</li>
      <li>设计并落地 AI客服系统架构，在 GPU集群私有化部署 Qwen、DeepSeek 等大模型，构建企业级知识库RAG系统，并结合业务知识图谱优化客服知识检索与答案生成能力。</li>
      <li>基于真实客服对话数据进行SFT微调与模型优化，持续提升客服问答准确率与业务理解能力。</li>
      <li>参与政企客户AI解决方案项目研发，在智慧工厂场景中应用计算机视觉技术（缺陷检测、目标检测与追踪、视频语义分割）实现工业生产智能化升级。</li>
    </ol>
- name: 中国人民财产保险股份有限公司河北省分公司
  position: "高级后端工程师"
  date: 2016.7 - 2018.5
  description: >-
    <p><strong>公司背景：</strong>中国人民财产保险股份有限公司（PICC）为国内大型国有保险集团，河北省分公司承担区域保险产品销售、理赔服务及互联网保险业务平台建设。</p>
    <p><strong>工作职责：</strong>负责互联网保险电商平台的后端架构设计与核心模块开发，基于 Django + MySQL + Redis + Celery 构建高并发保险销售系统，完成用户中心、保险产品管理及销售报表等模块开发，并通过缓存优化、异步任务处理与Nginx部署提升系统性能与稳定性。</p>


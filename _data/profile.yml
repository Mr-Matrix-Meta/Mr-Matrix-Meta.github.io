short_bio_text_justify: false
short_bio: >-
  <p>
    有着扎实的数学知识和丰富的工程实践经验，善于深入浅出的讲授人工智能领域相关原理。
  </p>
  <p>
    围绕构建高效、智能的AI系统这一核心目标，系统性地涵盖从底层算法到上层应用的全栈技术体系，具体包括以下三大层面：
  </p>
  <p>
    第一，高性能AI系统后端工程。具备扎实的Python后端开发能力，精通Django、Flask、FastAPI等主流Web框架，尤其擅长基于FastAPI加ASGI的高性能异步API架构设计与高并发服务部署。深入理解asyncio异步编程模型与事件循环机制，能够设计高吞吐、低延迟的服务系统。熟练运用MySQL、PostgreSQL、Redis及消息队列进行系统解耦与性能优化，掌握Docker容器化部署、Nginx反向代理及Linux服务运维，具备从系统设计到落地部署的完整工程能力。
  </p>
  <p>
    第二，机器学习与深度学习算法。具备扎实的机器学习理论基础，深入理解梯度下降优化机制及各类核心算法，包括线性回归、逻辑回归、SVM、决策树、集成学习和聚类等，并能够基于业务场景进行系统化特征工程与模型评估。在计算机视觉方向具有丰富工程经验，熟练使用OpenCV，深入理解两阶段检测R-CNN系列与一阶段检测YOLO系列原理，熟悉语义与实例分割、OCR全流程、姿态估计及多目标跟踪。掌握PyTorch与TensorFlow，熟悉CNN与Transformer架构及注意力机制优化。
  </p>
  <p>
    第三，大模型核心技术与应用。深入理解Transformer架构及DeepSeek、Qwen、MoE等主流模型设计。研究覆盖SFT、LoRA、QLoRA等高效微调技术，以及RLHF、PPO、DPO、GRPO等对齐训练方法。具备DeepSpeed混合并行分布式预训练经验与TensorRT推理优化能力。在数据侧，熟悉多源数据集构建及并行化清洗流程。同时，专注RAG与Agent应用开发，精通LangChain与LangGraph等框架，具备MCP协议开发经验，致力于推动大模型在复杂业务场景中的高效落地。
  </p>


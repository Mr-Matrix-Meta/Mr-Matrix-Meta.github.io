{% assign awards = site.data.profile.awards | reverse %}
<div class="my-3 p-0 bg-white shadow-sm rounded-xl">
    <h6 class="font-weight-bold border-bottom border-gray p-3 mb-0">
        获奖情况及证书
    </h6>
    {% for item in awards %}
    <div class="d-none d-md-block">
        <div class="row no-gutters {% unless forloop.last %}border-bottom{% endunless %} border-gray">
            <div class="col-md-3 col-xl-2 mb-md-0 p-md-3">
                {%- if item.cover -%}
                <img data-src="{{ item.cover | relative_url }}" alt="{{ item.name }}" class="lazy w-100 rounded-sm" src="{{ '/assets/images/empty_300x200.png' | relative_url }}">
                {%- else -%}
                <svg class="bubble-visual-hash lazy w-100 rounded-sm" viewBox="0 0 300 200"></svg>
                {%- endif -%}
            </div>
            <div class="col-md-9 col-xl-10 p-3 pl-md-0">
                <h5 class="mt-0 mb-1 font-weight-normal">{{ item.name }}</h5>
                <p class="mt-0 mb-0 small"><i>{{ item.org }}</i></p>
                <p class="mt-0 mb-0 small text-muted">{{ item.date }}</p>
            </div>
        </div>
    </div>
    <div class="row no-gutters d-md-none {% unless forloop.last %}border-bottom{% endunless %} border-gray {% if forloop.first %}rounded-xl-top{% endif %} {% if forloop.last %}rounded-xl-bottom{% endif %} {% if item.cover %}lazy{% endif %}" data-src="{{ item.cover | relative_url }}">
        <div class="w-100 {% if forloop.first %}rounded-xl-top{% endif %} {% if forloop.last %}rounded-xl-bottom{% endif %}" style="background-color: rgba(255,255,255,0.9);">
            <div class="d-flex align-items-start flex-column py-3 px-4">
                <div class="mb-auto"></div>
                <div>
                    <h5 class="mt-0 mb-1 font-weight-normal">{{ item.name }}</h5>
                    <p class="mt-0 mb-0 small"><i>{{ item.org }}</i></p>
                    <p class="mt-0 mb-0 small text-muted">{{ item.date }}</p>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
